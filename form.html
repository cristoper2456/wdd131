<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Submit a product review including rating, installation date, and useful features.">
    <meta name="author" content="Cristopher Castro">
    <title>Product Review Form</title>
    <link rel="stylesheet" href="styles/form-review.css">
    <link rel="stylesheet" href="styles/form-review-big.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html">
            <p><span class="required-note">*</span> Required field</p>
            <div class="form-group">
                <label for="product">Product Name <span class="required">*</span></label>
                <select id="product" name="product" required>
                    <option value="" disabled selected>Select a Product ...</option>
                </select>
            </div>

            <fieldset class="form-group">
                <legend>Overall Rating <span class="required">*</span></legend>
                <div class="rating">
                    <input type="radio" id="rating1" name="rating" value="1" required>
                    <label for="rating1">1 &star;</label>

                    <input type="radio" id="rating2" name="rating" value="2" required>
                    <label for="rating2">2 &star;</label>

                    <input type="radio" id="rating3" name="rating" value="3" required>
                    <label for="rating3">3 &star;</label>

                    <input type="radio" id="rating4" name="rating" value="4" required>
                    <label for="rating4">4 &star;</label>

                    <input type="radio" id="rating5" name="rating" value="5" required>
                    <label for="rating5">5 &star;</label>
                </div>
            </fieldset>

            <div class="form-group">
                <label for="installDate">Date of Installation <span class="required">*</span></label>
                <input type="date" id="installDate" name="installDate" required>
            </div>

            <fieldset class="form-group">
                <legend>Useful Features</legend>
                <input type="checkbox" id="feature1" name="features" value="easy-to-use">
                <label for="feature1">Easy to use</label>

                <input type="checkbox" id="feature2" name="features" value="durable">
                <label for="feature2">Durable</label>

                <input type="checkbox" id="feature3" name="features" value="affordable">
                <label for="feature3">Affordable</label>

                <input type="checkbox" id="feature4" name="features" value="good-looking">
                <label for="feature4">Good looking</label>
            </fieldset>

            <div class="form-group">
                <label for="review">Written Review</label>
                <textarea id="review" name="review"></textarea>
            </div>

            <div class="form-group">
                <label for="username">Your Name</label>
                <input type="text" id="username" name="username">
            </div>

            <div class="form-group">
                <input type="submit" value="Submit Review">
            </div>
        </form>
    </main>

    <footer>
        <p>© Cristopher Castro | Dominican Republic | <span id="currentyear"></span></p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
